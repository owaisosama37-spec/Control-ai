openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: |
    Authenticated room API. All project, dashboard, audit and member operations
    accept the optional x-room-owner request header containing a Clerk user ID.
    Omit it to select the authenticated user's own room. A header is a selector,
    not authorization: the server verifies explicit membership on every request.
     Owners manage members, delete projects and approve final delivery;
     editors create/edit and submit work; reviewers approve plans, reject, pause
     and resume; viewers have read-only access.
    GET /rooms always lists rooms for the authenticated identity.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /webhooks/github:
    post:
      operationId: receiveGitHubWebhook
      description: |
        Public GitHub delivery endpoint. Requires the SHA-256 signature of the
        original request body and a matching configured repository. Ping is
        acknowledged; other events are explicitly not applied to room projects.
      parameters:
        - { name: x-hub-signature-256, in: header, required: true, schema: { type: string } }
        - { name: x-github-event, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GitHubWebhookPayload" }
      responses:
        "200":
          description: Signed ping accepted
          content:
            application/json:
              schema:
                type: object
                required: [accepted, event]
                properties:
                  accepted: { type: boolean }
                  event: { type: string }
        "202":
          description: Signed event accepted but not applied to account-scoped projects
          content:
            application/json:
              schema:
                type: object
                required: [accepted, processed]
                properties:
                  accepted: { type: boolean }
                  processed: { type: boolean }
        "401": { description: Invalid signature }
        "403": { description: Unexpected repository }
        "503": { description: Webhook configuration missing }
  /rooms:
    get:
      operationId: listRooms
      responses:
        "200":
          description: Own room and explicitly granted rooms
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/RoomAccess" } }
  /operations:
    get:
      operationId: getRoomOperations
      description: Persistent emergency stop state for the selected room. No autonomous runner is installed.
      responses:
        "200":
          description: Room operational state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomOperations" }
  /emergency-stop:
    post:
      operationId: emergencyStop
      description: Room owner only. Freezes room mutations and records a signed audit event.
      responses:
        "200":
          description: Room stopped
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomOperations" }
        "403": { description: Room owner required }
        "409": { description: Room already stopped }
  /emergency-resume:
    post:
      operationId: emergencyResume
      description: Room owner only. Clears the emergency stop with a signed audit event.
      responses:
        "200":
          description: Room resumed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomOperations" }
        "403": { description: Room owner required }
        "409": { description: Room not stopped }
  /members:
    get:
      operationId: listMembers
      responses:
        "200":
          description: Members of selected room (x-room-owner header; defaults to own room)
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/RoomMember" } }
    put:
      operationId: saveMember
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberInput" }
      responses:
        "200":
          description: Membership granted or updated by room owner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomMember" }
  /members/{userId}:
    delete:
      operationId: removeMember
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Membership revoked by room owner
  /projects:
    get:
      operationId: listProjects
      responses:
        "200":
          description: Projects in the signed-in user's room
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Project" } }
    post:
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
  /projects/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getProject
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
    patch:
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
    delete:
      operationId: deleteProject
      responses:
        "204": { description: Deleted }
  /projects/{id}/status:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      operationId: transitionProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransitionInput" }
      responses:
        "200":
          description: Status changed with signed audit event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
  /dashboard:
    get:
      operationId: getDashboard
      responses:
        "200":
          description: Live room totals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
  /audit:
    get:
      operationId: listActivity
      responses:
        "200":
          description: Recent signed activity
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Activity" } }
  /system/status:
    get:
      operationId: getSystemStatus
      responses:
        "200":
          description: Actual runtime readiness, not simulated agent connections
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemStatus" }
  /integrations/access:
    get:
      operationId: getIntegrationAccess
      responses:
        "200":
          description: Authenticated account-level administrator check
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationAccess" }
  /integrations:
    get:
      operationId: listIntegrations
      description: Administrator only. Returns variable names, never secret values.
      responses:
        "200":
          description: Configuration state of the five integrations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IntegrationConfiguration" }
        "403": { description: Integration administrator access required }
  /integrations/{id}/test:
    post:
      operationId: testIntegration
      description: Administrator only. Sends a test email to the administrator for the email integration.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, enum: [claude, gemini, github, slack, email] } }
      responses:
        "200":
          description: Live connection test result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationTestResult" }
        "400": { description: Unknown or unconfigured integration }
        "403": { description: Integration administrator access required }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    GitHubWebhookPayload:
      type: object
      additionalProperties: true
    IntegrationAccess:
      type: object
      required: [isAdmin, needsSetup]
      properties:
        isAdmin: { type: boolean }
        needsSetup: { type: boolean }
    IntegrationConfiguration:
      type: object
      required: [id, configured, missing, alternatives]
      properties:
        id: { type: string, enum: [claude, gemini, github, slack, email] }
        configured: { type: boolean }
        missing:
          type: array
          items: { type: string }
        alternatives:
          type: array
          description: Missing variable names for each alternative credential set; one complete set is sufficient.
          items:
            type: array
            items: { type: string }
    IntegrationTestResult:
      type: object
      required: [ok, message]
      properties:
        ok: { type: boolean }
        message: { type: string }
    RoomAccess:
      type: object
      required: [owner_id, role]
      properties:
        owner_id: { type: string }
        role: { type: string, enum: [owner, editor, reviewer, viewer] }
    RoomOperations:
      type: object
      required: [stopped, stopped_at, autonomous_execution]
      properties:
        stopped: { type: boolean }
        stopped_at: { type: [string, "null"], format: date-time }
        autonomous_execution: { type: boolean, description: "Always false until a real runner exists." }
    RoomMember:
      type: object
      required: [user_id, role]
      properties:
        user_id: { type: string }
        role: { type: string, enum: [owner, editor, reviewer, viewer] }
    MemberInput:
      type: object
      required: [user_id, role]
      properties:
        user_id: { type: string, pattern: '^user_[a-zA-Z0-9]+$', maxLength: 128 }
        role: { type: string, enum: [editor, reviewer, viewer] }
    ProjectStatus:
      type: string
      enum: [draft, approved_plan, awaiting_review, merged, paused, rejected]
    ProjectInput:
      type: object
      required: [name, description, client_name, budget, actual_cost, priority, project_type]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, maxLength: 5000 }
        client_name: { type: string, maxLength: 160 }
        budget: { type: number, minimum: 0, maximum: 1000000000 }
        actual_cost: { type: number, minimum: 0, maximum: 1000000000 }
        priority: { type: integer, minimum: 1, maximum: 10 }
        project_type: { type: string, enum: [whatsapp_bot, crm, analytics, email_campaign, ecommerce, other] }
    Project:
      allOf:
        - $ref: "#/components/schemas/ProjectInput"
        - type: object
          required: [project_id, status, created_at, updated_at, rejection_reason]
          properties:
            project_id: { type: string }
            status: { $ref: "#/components/schemas/ProjectStatus" }
            created_at: { type: string }
            updated_at: { type: string }
            rejection_reason: { type: string }
    TransitionInput:
      type: object
      required: [status, expected_status]
      properties:
        status: { $ref: "#/components/schemas/ProjectStatus" }
        expected_status: { $ref: "#/components/schemas/ProjectStatus" }
        reason: { type: string, maxLength: 2000 }
    Dashboard:
      type: object
      required: [total, active, pending, completed, budget, spent]
      properties:
        total: { type: integer }
        active: { type: integer }
        pending: { type: integer }
        completed: { type: integer }
        budget: { type: number }
        spent: { type: number }
    Activity:
      type: object
      required: [id, actor_id, action, project_id, project_name, description, created_at, verified]
      properties:
        id: { type: string }
        actor_id: { type: string, description: "Clerk ID of the actor who performed the action." }
        action: { type: string }
        project_id: { type: string }
        project_name: { type: string }
        description: { type: string }
        created_at: { type: string }
        verified: { type: boolean }
    IntegrationStatus:
      type: object
      required: [name, status, description]
      properties:
        name: { type: string }
        status: { type: string, enum: [connected, not_connected, unavailable] }
        description: { type: string }
    ConfiguredIntegration:
      type: object
      required: [configured]
      properties:
        configured: { type: boolean }
    SystemIntegrations:
      type: object
      required: [claude, gemini, github, slack, email]
      properties:
        claude: { $ref: "#/components/schemas/ConfiguredIntegration" }
        gemini: { $ref: "#/components/schemas/ConfiguredIntegration" }
        github: { $ref: "#/components/schemas/ConfiguredIntegration" }
        slack: { $ref: "#/components/schemas/ConfiguredIntegration" }
        email: { $ref: "#/components/schemas/ConfiguredIntegration" }
    SystemStatus:
      type: object
      required: [database, dbName, environment, authentication, clerkMode, integrations, orchestration]
      properties:
        database: { type: string, enum: [connected, unavailable] }
        dbName: { type: string }
        environment: { type: string, enum: [development, production, test] }
        authentication: { type: string }
        clerkMode: { type: string, enum: [development, production] }
        orchestration: { type: string }
        integrations: { $ref: "#/components/schemas/SystemIntegrations" }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

